<mat-toolbar>
  <button
    matIconButton
    class="ks-icon"
    aria-label="Example icon-button with menu icon"
  >
    <img
      src="https://news.ycombinator.com/y18.svg"
      style="border: 1px white solid; display: block; width: 25px; height: 25px"
      alt="Y Combinator Logo"
    />
  </button>
  <span class="ks-title"><h2>Hacker News</h2></span>
  <div class="ks-tools">
    <span><p>Comments</p></span>

  <button
    matIconButton
