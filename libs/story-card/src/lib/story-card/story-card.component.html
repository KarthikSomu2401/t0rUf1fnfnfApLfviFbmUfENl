<mat-card class="story-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      <a [href]="story().url" target="_blank">{{ story().title }}</a>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="content-container">
    <p>
      {{ story().score }} {{ story().score > 1 ? 'points' : 'point' }} by
      {{ story().by }}
      {{ computedTime(story().time) }}
    </p>
    <span class="icons-container">
      <div class="icon-with-number">
        <button matButton>
          <mat-icon class="hide-icon">visibility_off</mat-icon>
        </button>
      </div>
      <div class="icon-with-number">
        <button matButton (click)="comments.emit(story().kids)">
          <mat-icon class="comments-icon">comments</mat-icon>
          <span class="icon-number">
            <p>{{ story().descendants }}</p>
          </span>
        </button>
      </div>
    </span>
  </mat-card-content>
</mat-card>
